<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar paciente - Heredograma IA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="layout">
    <button
      id="btnMenuMobile"
      class="botao-menu-mobile"
      type="button"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      <span></span><span></span><span></span>
    </button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-marca">
        <span class="sidebar-marca-titulo">Heredograma IA</span>
      </div>

      <nav class="sidebar-nav" aria-label="Navegação principal">
        <div class="sidebar-grupo">
          <a href="index.html">Início</a>
        </div>

        <div class="sidebar-grupo">
          <p class="sidebar-titulo-grupo">Atendimento</p>
          <a href="pacientes.html" class="ativo">Pacientes</a>
        </div>

        <div class="sidebar-grupo" id="grupoConfiguracao" hidden>
          <p class="sidebar-titulo-grupo">Configuração</p>
        </div>
      </nav>

      <div class="sidebar-usuario">
        <span>Olá, <strong id="nomeUsuarioLogado"></strong></span>
        <button id="btnLogout" class="link-botao">Sair</button>
      </div>
    </aside>

    <div class="conteudo-principal">
      <header class="cabecalho-pagina">
        <h1>Cadastrar paciente</h1>
        <p><a href="pacientes.html" class="link-acao">← Voltar para pacientes</a></p>
      </header>

      <main>
        <section class="cartao">
          <h2>Novo paciente</h2>
          <form id="formPaciente">

            <h3>Dados pessoais</h3>
            <div class="campo campo-largo">
              <label for="nome">Nome completo</label>
              <input type="text" id="nome" required>
            </div>
            <div class="campo campo-largo">
              <label for="nomeSocial">Nome social (opcional)</label>
              <input type="text" id="nomeSocial">
            </div>

            <div class="grade-formulario grade-3">
              <div class="campo">
                <label for="dataNascimento">Data de nascimento</label>
                <input type="date" id="dataNascimento" required>
              </div>
              <div class="campo">
                <label for="sexo">Sexo</label>
                <select id="sexo" required>
                  <option value="">Selecione</option>
                  <option value="M">Masculino</option>
                  <option value="F">Feminino</option>
                  <option value="Outro">Outro</option>
                </select>
              </div>
              <div class="campo">
                <label for="tipoSanguineo">Tipo sanguíneo (opcional)</label>
                <select id="tipoSanguineo">
                  <option value="">Não informado</option>
                  <option value="A+">A+</option>
                  <option value="A-">A-</option>
                  <option value="B+">B+</option>
                  <option value="B-">B-</option>
                  <option value="AB+">AB+</option>
                  <option value="AB-">AB-</option>
                  <option value="O+">O+</option>
                  <option value="O-">O-</option>
                </select>
              </div>
            </div>

            <div class="grade-formulario grade-2">
              <div class="campo">
                <label for="documento">CPF</label>
                <input type="text" id="documento" required>
              </div>
              <div class="campo">
                <label for="rg">RG (opcional)</label>
                <input type="text" id="rg">
              </div>
            </div>

            <h3>Contato</h3>
            <div class="grade-formulario grade-3">
              <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone">
              </div>
              <div class="campo">
                <label for="whatsapp">WhatsApp</label>
                <input type="text" id="whatsapp">
              </div>
              <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email">
              </div>
            </div>

            <h3>Endereço</h3>
            <div class="grade-formulario grade-3">
              <div class="campo">
                <label for="cep">CEP</label>
                <input type="text" id="cep" inputmode="numeric" placeholder="Ex: 64000-000">
                <span id="mensagemCep" class="mensagem-discreta"></span>
              </div>
              <div class="campo">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco">
              </div>
              <div class="campo">
                <label for="numero">Número</label>
                <input type="text" id="numero">
              </div>
            </div>

            <div class="grade-formulario">
              <div class="campo">
                <label for="complemento">Complemento</label>
                <input type="text" id="complemento">
              </div>
              <div class="campo">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro">
              </div>
              <div class="campo">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade">
              </div>
              <div class="campo">
                <label for="uf">UF</label>
                <select id="uf"></select>
              </div>
            </div>

            <h3>Recém-nascido / Responsável legal</h3>
            <div class="campo campo-checkbox">
              <label>
                <input type="checkbox" id="recemNascido">
                Paciente é recém-nascido (ainda sem CPF próprio)
              </label>
            </div>
            <div class="grade-formulario grade-2">
              <div class="campo">
                <label for="nomeResponsavel">Nome do responsável</label>
                <input type="text" id="nomeResponsavel">
              </div>
              <div class="campo">
                <label for="parentescoResponsavel">Parentesco do responsável</label>
                <input type="text" id="parentescoResponsavel" placeholder="Ex: mãe, pai, tutor">
              </div>
            </div>

            <h3>Preferências e LGPD</h3>
            <div class="campo campo-checkbox">
              <label>
                <input type="checkbox" id="aceitaMensagens" checked>
                Aceita receber mensagens (lembretes, avisos)
              </label>
            </div>
            <div class="campo campo-checkbox">
              <label>
                <input type="checkbox" id="autorizacaoLgpd">
                Autorização LGPD concedida
              </label>
            </div>

            <button type="submit" class="botao">Cadastrar paciente</button>
            <span id="mensagemPaciente"></span>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    exigirLogin();
    inicializarBarraUsuario();
  </script>
  <script src="enderecos.js"></script>
  <script src="pacientes-cadastrar.js"></script>
</body>
</html>
