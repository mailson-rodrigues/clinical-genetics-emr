<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes - Heredograma IA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="layout">
    <button
      id="btnMenuMobile"
      class="botao-menu-mobile"
      type="button"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      <span></span><span></span><span></span>
    </button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-marca">
        <span class="sidebar-marca-titulo">Heredograma IA</span>
      </div>

      <nav class="sidebar-nav" aria-label="Navegação principal">
        <div class="sidebar-grupo">
          <a href="index.html">Início</a>
        </div>

        <div class="sidebar-grupo">
          <p class="sidebar-titulo-grupo">Atendimento</p>
          <a href="pacientes.html" class="ativo">Pacientes</a>
        </div>

        <div class="sidebar-grupo" id="grupoConfiguracao" hidden>
          <p class="sidebar-titulo-grupo">Configuração</p>
        </div>
      </nav>

      <div class="sidebar-usuario">
        <span>Olá, <strong id="nomeUsuarioLogado"></strong></span>
        <button id="btnLogout" class="link-botao">Sair</button>
      </div>
    </aside>

    <div class="conteudo-principal">
      <header class="cabecalho-pagina">
        <h1>Pacientes</h1>
        <p>Busque um paciente já cadastrado ou cadastre um novo</p>
      </header>

      <main>
        <section class="cartao">
          <div class="barra-acoes">
            <div class="campo campo-largo">
              <label for="buscaPaciente">Buscar por nome ou CPF</label>
              <input type="text" id="buscaPaciente" placeholder="Digite o nome ou o CPF do paciente">
            </div>
            <a href="pacientes-cadastrar.html" class="botao">Cadastrar novo paciente</a>
          </div>

          <table class="tabela">
            <thead>
              <tr>
                <th>Nome</th>
                <th>Nascimento</th>
                <th>Sexo</th>
                <th>Documento</th>
                <th>Cidade/UF</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="corpoTabelaPacientes"></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    exigirLogin();
    inicializarBarraUsuario();
  </script>
  <script src="pacientes.js"></script>
</body>
</html>
