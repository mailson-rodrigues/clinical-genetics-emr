<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profissionais - Heredograma IA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="layout">
    <button
      id="btnMenuMobile"
      class="botao-menu-mobile"
      type="button"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      <span></span><span></span><span></span>
    </button>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-marca">
        <span class="sidebar-marca-titulo">Heredograma IA</span>
      </div>

      <nav class="sidebar-nav" aria-label="Navegação principal">
        <div class="sidebar-grupo">
          <a href="index.html">Início</a>
        </div>

        <div class="sidebar-grupo">
          <p class="sidebar-titulo-grupo">Atendimento</p>
          <a href="pacientes.html">Pacientes</a>
        </div>

        <div class="sidebar-grupo" id="grupoConfiguracao" hidden>
          <p class="sidebar-titulo-grupo">Configuração</p>
        </div>
      </nav>

      <div class="sidebar-usuario">
        <span>Olá, <strong id="nomeUsuarioLogado"></strong></span>
        <button id="btnLogout" class="link-botao">Sair</button>
      </div>
    </aside>

    <div class="conteudo-principal">
      <header class="cabecalho-pagina">
        <h1>Profissionais</h1>
        <p>Cadastro de profissionais</p>
      </header>

      <main>
        <section class="cartao">
          <h2>Novo profissional</h2>
          <form id="formProfissional">
            <div class="campo campo-largo">
              <label for="nome">Nome completo</label>
              <input type="text" id="nome" required>
            </div>

            <div class="grade-formulario grade-2">
              <div class="campo">
                <label for="email">E-mail (usado para login)</label>
                <input type="email" id="email" required>
              </div>
              <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required minlength="6">
              </div>
            </div>

            <div class="grade-formulario grade-2">
              <div class="campo">
                <label for="especialidade">Especialidade</label>
                <div class="campo-com-botao">
                  <select id="especialidade">
                    <option value="">Não informar</option>
                  </select>
                  <button
                    type="button"
                    id="btnNovaEspecialidade"
                    class="botao-secundario"
                    title="Cadastrar nova especialidade"
                    aria-label="Cadastrar nova especialidade"
                  >+</button>
                </div>
              </div>
              <div class="campo">
                <label for="registroProfissional">Registro profissional (CRM, CRBio, etc.)</label>
                <input type="text" id="registroProfissional">
              </div>
            </div>

            <div class="grade-formulario grade-2">
              <div class="campo">
                <label for="nivelAcesso">Nível de acesso</label>
                <select id="nivelAcesso">
                  <option value="profissional">Profissional</option>
                  <option value="administrador">Administrador</option>
                </select>
              </div>
              <div class="campo" id="campoPerfilAcesso">
                <label for="perfilAcesso">Perfil de acesso</label>
                <select id="perfilAcesso">
                  <option value="">Nenhum</option>
                </select>
              </div>
            </div>

            <button type="submit" class="botao">Cadastrar profissional</button>
            <span id="mensagemProfissional"></span>
          </form>
        </section>

        <section class="cartao">
          <h2>Profissionais cadastrados</h2>
          <table class="tabela">
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Especialidade</th>
                <th>Registro</th>
                <th>Nível</th>
                <th>Perfil de acesso</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="corpoTabelaProfissionais"></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>

  <dialog id="modalEspecialidade">
    <form id="formNovaEspecialidade">
      <h2>Nova especialidade</h2>
      <div class="campo campo-largo">
        <label for="nomeNovaEspecialidade">Nome</label>
        <input type="text" id="nomeNovaEspecialidade" required placeholder="Ex: Oncologia">
      </div>
      <button type="submit" class="botao">Salvar</button>
      <button type="button" id="btnCancelarNovaEspecialidade" class="botao-secundario">Cancelar</button>
      <span id="mensagemNovaEspecialidade" class="erro"></span>
    </form>
  </dialog>

  <script src="auth.js"></script>
  <script>
    exigirLogin();
    inicializarBarraUsuario();
  </script>
  <script src="profissionais.js"></script>
</body>
</html>
